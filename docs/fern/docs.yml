redirects:
  # Old Sphinx URL -> new Fern page, one hop each. Sources and destinations both include the
  # /nemo/rl basepath. Order matters (first match wins): site root, apidocs and Sphinx
  # search/index pages, 0.7.0 -> latest alias, relocated top-level pages, autodoc pages with
  # no page of their own, then the *.html catch-alls.
  - source: "/nemo/rl/index.html"
    destination: "/nemo/rl/latest"
  - source: "/nemo/rl/index"
    destination: "/nemo/rl/latest"
  - source: "/nemo/rl/0.7.0/apidocs"
    destination: "/nemo/rl/latest/api-reference"
  - source: "/nemo/rl/0.7.0/apidocs/:path*"
    destination: "/nemo/rl/latest/api-reference"
  - source: "/nemo/rl/:version/apidocs"
    destination: "/nemo/rl/:version/api-reference"
  - source: "/nemo/rl/:version/apidocs/:path*"
    destination: "/nemo/rl/:version/api-reference"
  - source: "/nemo/rl/0.7.0/search.html"
    destination: "/nemo/rl/latest"
  - source: "/nemo/rl/0.7.0/genindex.html"
    destination: "/nemo/rl/latest/api-reference"
  - source: "/nemo/rl/0.7.0/py-modindex.html"
    destination: "/nemo/rl/latest/api-reference"
  - source: "/nemo/rl/0.7.0/_modules/:path*"
    destination: "/nemo/rl/latest/api-reference"
  - source: "/nemo/rl/:version/search.html"
    destination: "/nemo/rl/:version"
