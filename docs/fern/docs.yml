instances:
  - url: nemo-rl.docs.buildwithfern.com/nemo/rl
    custom-domain: docs.nvidia.com/nemo/rl
    multi-source: true

title: NVIDIA NeMo RL

global-theme: nvidia

logo:
  href: /nemo/rl/latest
  right-text: Documentation

layout:
  breadcrumbs:
    current-page: true

libraries:
  nemo-rl:
    input:
      git: https://github.com/NVIDIA-NeMo/RL
      subpath: nemo_rl
    output:
      path: ./api-reference/nemo-rl
    lang: python
  nemo-rl-0-7-0:
    input:
      git: https://github.com/NVIDIA-NeMo/RL
      subpath: nemo_rl
      ref: v0.7.0
    output:
      path: ./api-reference/0.7.0
    lang: python
  nemo-rl-0-6-0:
    input:
      git: https://github.com/NVIDIA-NeMo/RL
      subpath: nemo_rl
      ref: v0.6.0
    output:
      path: ./api-reference/0.6.0
    lang: python
  nemo-rl-0-5-0:
    input:
      git: https://github.com/NVIDIA-NeMo/RL
      subpath: nemo_rl
      ref: v0.5.0
    output:
      path: ./api-reference/0.5.0
    lang: python
  nemo-rl-0-4-0:
    input:
      git: https://github.com/NVIDIA-NeMo/RL
      subpath: nemo_rl
      ref: v0.4.0
    output:
      path: ./api-reference/0.4.0
    lang: python
  nemo-rl-0-3-0:
    input:
      git: https://github.com/NVIDIA-NeMo/RL
      subpath: nemo_rl
      ref: v0.3.0
    output:
      path: ./api-reference/0.3.0
    lang: python
  nemo-rl-0-2-1:
    input:
      git: https://github.com/NVIDIA-NeMo/RL
      subpath: nemo_rl
      ref: v0.2.1
    output:
      path: ./api-reference/0.2.1
    lang: python

navbar-links:
  - type: github
    value: https://github.com/NVIDIA-NeMo/RL

products:
  - display-name: NeMo RL
    slug: ""
    path: versions/latest.yml
    versions:
      - display-name: 0.7.0 (latest)
        path: versions/latest.yml
        slug: latest
      - display-name: nightly
        path: versions/nightly.yml
        slug: nightly
      - display-name: 0.6.0
        path: versions/0.6.0.yml
        slug: 0.6.0
        availability: stable
      - display-name: 0.5.0
        path: versions/0.5.0.yml
        slug: 0.5.0
        availability: stable
      - display-name: 0.4.0
        path: versions/0.4.0.yml
        slug: 0.4.0
        availability: stable
      - display-name: 0.3.0
        path: versions/0.3.0.yml
        slug: 0.3.0
        availability: stable
      - display-name: 0.2.1
        path: versions/0.2.1.yml
        slug: 0.2.1
        availability: stable

redirects:
  # Generated by utils/generate_redirects.py — re-run from repo root; see scripts README
  - source: "/index.html"
    destination: "/nemo/rl/latest"
  - source: "/index"
    destination: "/nemo/rl/latest"
  # 0.7.0 is the latest release
  - source: "/0.7.0"
    destination: "/nemo/rl/latest"
  - source: "/0.7.0/:path*"
    destination: "/nemo/rl/latest/:path*"
  # Sphinx autodoc pages are only available for nightly (see API Reference)
  - source: "/:version/apidocs"
    destination: "/nemo/rl/nightly/api-reference"
  - source: "/:version/apidocs/:path*"
    destination: "/nemo/rl/nightly/api-reference"
  # Autodoc links to private/empty modules that have no generated page of their own
  - source: "/0.2.1/nemo-rl-0-2-1/nemo_rl/converters/huggingface/vllm_export"
    destination: "/nemo/rl/0.2.1/nemo-rl-0-2-1/nemo_rl/converters/huggingface"
  - source: "/nemo-rl-0-2-1/nemo_rl/converters/huggingface/vllm_export"
    destination: "/nemo/rl/0.2.1/nemo-rl-0-2-1/nemo_rl/converters/huggingface"
  - source: "/0.2.1/nemo-rl-0-2-1/nemo_rl/converters/megatron/vllm_export"
    destination: "/nemo/rl/0.2.1/nemo-rl-0-2-1/nemo_rl/converters/megatron"
  - source: "/nemo-rl-0-2-1/nemo_rl/converters/megatron/vllm_export"
    destination: "/nemo/rl/0.2.1/nemo-rl-0-2-1/nemo_rl/converters/megatron"
  - source: "/0.2.1/nemo-rl-0-2-1/nemo_rl/metrics/metrics_utils"
    destination: "/nemo/rl/0.2.1/nemo-rl-0-2-1/nemo_rl/metrics"
  - source: "/nemo-rl-0-2-1/nemo_rl/metrics/metrics_utils"
    destination: "/nemo/rl/0.2.1/nemo-rl-0-2-1/nemo_rl/metrics"
  - source: "/0.2.1/nemo-rl-0-2-1/nemo_rl/models/megatron/common"
    destination: "/nemo/rl/0.2.1/nemo-rl-0-2-1/nemo_rl/models/megatron"
  - source: "/nemo-rl-0-2-1/nemo_rl/models/megatron/common"
    destination: "/nemo/rl/0.2.1/nemo-rl-0-2-1/nemo_rl/models/megatron"
  - source: "/0.3.0/nemo-rl-0-3-0/nemo_rl/converters/huggingface/vllm_export"
    destination: "/nemo/rl/0.3.0/nemo-rl-0-3-0/nemo_rl/converters/huggingface"
  - source: "/nemo-rl-0-3-0/nemo_rl/converters/huggingface/vllm_export"
    destination: "/nemo/rl/0.3.0/nemo-rl-0-3-0/nemo_rl/converters/huggingface"
  - source: "/0.3.0/nemo-rl-0-3-0/nemo_rl/converters/megatron/vllm_export"
    destination: "/nemo/rl/0.3.0/nemo-rl-0-3-0/nemo_rl/converters/megatron"
  - source: "/nemo-rl-0-3-0/nemo_rl/converters/megatron/vllm_export"
    destination: "/nemo/rl/0.3.0/nemo-rl-0-3-0/nemo_rl/converters/megatron"
  - source: "/0.3.0/nemo-rl-0-3-0/nemo_rl/metrics/metrics_utils"
    destination: "/nemo/rl/0.3.0/nemo-rl-0-3-0/nemo_rl/metrics"
  - source: "/nemo-rl-0-3-0/nemo_rl/metrics/metrics_utils"
    destination: "/nemo/rl/0.3.0/nemo-rl-0-3-0/nemo_rl/metrics"
  - source: "/nightly/:path*/index.html"
    destination: "/nemo/rl/nightly/:path*"
  - source: "/:path*/index.html"
    destination: "/nemo/rl/:path*"
  # Sphinx page URLs (foo.html); must follow all :path*/index.html rules above
  - source: "/:path*.html"
    destination: "/nemo/rl/:path*"
