instances:
  - url: nemo-rl.docs.buildwithfern.com/nemo/rl
    custom-domain: docs.nvidia.com/nemo/rl
    multi-source: true

title: NVIDIA NeMo RL

global-theme: nvidia

logo:
  href: /nemo/rl/nightly
  right-text: NeMo RL

libraries:
  nemo-rl:
    input:
      git: https://github.com/NVIDIA-NeMo/RL
      subpath: nemo_rl
    output:
      path: ./api-reference/nemo-rl
    lang: python

navbar-links:
  - type: github
    value: https://github.com/NVIDIA-NeMo/RL

versions:
  - display-name: nightly
    path: versions/nightly.yml
    slug: nightly

redirects:
  # Generated by utils/generate_redirects.py — re-run from repo root; see scripts README
  - source: "/index.html"
    destination: "/nemo/rl/nightly"
  - source: "/index"
    destination: "/nemo/rl/nightly"
  - source: "/nightly/:path*/index.html"
    destination: "/nemo/rl/nightly/:path*"
  - source: "/:path*/index.html"
    destination: "/nemo/rl/:path*"
  # Sphinx page URLs (foo.html); must follow all :path*/index.html rules above
  - source: "/:path*.html"
    destination: "/nemo/rl/:path*"
